
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Automatic Fit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>

<main class="cadastro-page">

    <!-- APRESENTAÇÃO -->
    <section class="apresentacao">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Automatic Fit">
        <h1>Automatic <span>Fit</span></h1>
        <p>Gerencie aulas, horários e inscrições com praticidade.</p>
    </section>

    <!-- CADASTRO -->
    <section class="area-cadastro">
        <div class="cadastro-card">

            <img class="logo-pequena"
                 src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="Automatic Fit">

            <h2>Crie sua conta</h2>
            <p class="subtitulo">Preencha os dados abaixo para começar.</p>

            {% with mensagens = get_flashed_messages() %}
                {% for mensagem in mensagens %}
                    <div class="mensagem">{{ mensagem }}</div>
                {% endfor %}
            {% endwith %}

            <form action="{{ url_for('cadastro') }}" method="POST">

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="7" r="4"/>
                        <path d="M5 21v-3a7 7 0 0 1 14 0v3"/>
                    </svg>
                    <input type="text" id="nome" name="nome"
                           placeholder="Nome Completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 7 9-7"/>
                    </svg>
                    <input type="email" id="email" name="email"
                           placeholder="E-mail" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 3h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v4a3 3 0 0 1-3 3A15 15 0 0 1 3 6a3 3 0 0 1 3-3z"/>
                    </svg>
                    <input type="tel" id="telefone" name="telefone"
                           placeholder="Telefone">
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 10h18"/>
                    </svg>
                    <input type="text" id="cpf" name="cpf"
                           placeholder="CPF (11 números)"
                           maxlength="14" inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="nascimento" class="rotulo-data">Data de Nascimento</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="16" rx="2"/>
                        <path d="M7 2v6M17 2v6M3 10h18"/>
                    </svg>
                    <input type="date" id="nascimento"
                           name="data_nascimento" required>
                </div>

                <div class="campo">
                    <label for="senha">Crie uma Senha</label>
                    <img class="cadeado"
                         src="{{ url_for('static', filename='img/cadeado.png') }}"
                         alt="">
                    <input type="password" id="senha" name="senha"
                           placeholder="Crie uma Senha" required>
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar Senha</label>
                    <img class="cadeado"
                         src="{{ url_for('static', filename='img/cadeado.png') }}"
                         alt="">
                    <input type="password" id="confirmar_senha"
                           name="confirmar_senha"
                           placeholder="Confirmar Senha" required>
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar-se →
                </button>

                <p class="link-login">
                    Já tem uma conta?
                    <a href="{{ url_for('login') }}">Fazer Login</a>
                </p>

            </form>
        </div>
    </section>

</main>

</body>
</html>
